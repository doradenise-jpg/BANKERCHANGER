version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankerchanger
      POSTGRES_PASSWORD: bankerchanger
      POSTGRES_DB: bankerchanger
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bankerchanger']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    ports:
      - '3001:3001'
    environment:
      - DATABASE_URL=postgresql://bankerchanger:bankerchanger@postgres:5432/bankerchanger
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - backend_node_modules:/app/node_modules
    networks:
      - default

  indexer:
    build: ./indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file: ./indexer/.env
    environment:
      - FACTORY_CONTRACT_ADDRESS=${FACTORY_CONTRACT_ADDRESS}
      - SOROBAN_RPC_URL=${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
    ports:
      - '3002:3002'
    volumes:
      - indexer_data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3002/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file: ./frontend/.env
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default

  postgres-test:
    image: postgres:15-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: bankerchanger
      POSTGRES_PASSWORD: bankerchanger
      POSTGRES_DB: bankerchanger_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
  indexer_data:
  backend_node_modules:

networks:
  default:
    name: bankerchanger
    driver: bridge
